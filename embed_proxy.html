<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>社群貼文預覽</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #embedRoot,
      #embedRoot iframe,
      #embedRoot blockquote {
        max-width: 100% !important;
      }

      #embedRoot blockquote {
        margin: 0 auto !important;
        background: #fff !important;
        border: 1px solid rgb(243 57 145 / 12%) !important;
        box-shadow: 0 10px 28px rgb(126 86 196 / 10%) !important;
      }

      #embedRoot iframe {
        border-radius: 16px !important;
        box-shadow: none !important;
      }

      .embed-error {
        display: grid;
        min-height: 11rem;
        padding: 1.5rem;
        place-items: center;
        color: #6b536f;
        background: #fff7fb;
        font-size: 0.85rem;
        line-height: 1.65;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="embedRoot"></div>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const type = params.get("type");
        const rawPostUrl = params.get("url");
        const root = document.querySelector("#embedRoot");
        const allowedHosts = {
          instagram: new Set(["instagram.com", "www.instagram.com"]),
          threads: new Set(["threads.net", "www.threads.net", "threads.com", "www.threads.com"]),
        };
        let postUrl = "";
        let lastHeight = 0;
        let lastReady = false;

        try {
          const parsed = new URL(rawPostUrl || "");
          if (!allowedHosts[type]?.has(parsed.hostname.toLowerCase())) throw new Error("Unsupported source");
          if (parsed.protocol !== "https:") throw new Error("Unsupported protocol");
          parsed.search = "";
          parsed.hash = "";
          if (type === "threads") parsed.pathname = parsed.pathname.replace(/\/media\/?$/i, "");
          postUrl = parsed.toString();
        } catch (error) {
          root.className = "embed-error";
          root.textContent = "無法載入這則貼文預覽。";
        }

        function reportHeight(forceReady = false) {
          const nestedBottom = [...root.querySelectorAll("iframe")].reduce((maximum, frame) => {
            const rect = frame.getBoundingClientRect();
            return Math.max(maximum, Math.ceil(rect.bottom + window.scrollY));
          }, 0);
          const height = Math.max(
            1,
            document.documentElement.scrollHeight,
            document.body.scrollHeight,
            root.scrollHeight,
            root.offsetHeight,
            nestedBottom,
          );
          const embeddedFrame = root.querySelector("iframe");
          const hasFinalMediaSize = type !== "instagram" || height >= 420;
          const ready = forceReady || Boolean(embeddedFrame && hasFinalMediaSize) || root.classList.contains("embed-error");
          if (height === lastHeight && ready === lastReady) return;
          lastHeight = height;
          lastReady = ready;
          window.parent.postMessage(
            {
              type: "performance-embed-resize",
              height,
              ready,
              url: postUrl,
            },
            window.location.origin,
          );
        }

        function showEmbedError() {
          if (root.querySelector("iframe")) {
            reportHeight(true);
            return;
          }
          if (root.classList.contains("embed-error")) return;
          root.replaceChildren();
          root.className = "embed-error";
          root.textContent = "預覽暫時無法載入，請使用下方按鈕開啟原始貼文。";
          reportHeight(true);
        }

        if (postUrl && type === "threads") {
          const blockquote = document.createElement("blockquote");
          blockquote.className = "text-post-media";
          blockquote.setAttribute("data-text-post-permalink", postUrl);
          blockquote.setAttribute("data-text-post-version", "0");
          blockquote.style.cssText = "background:#fff;border:1px solid #f339911f;border-radius:16px;box-shadow:0 10px 28px #7e56c419;max-width:540px;min-width:270px;padding:0;width:99.375%;";
          root.append(blockquote);

          const script = document.createElement("script");
          script.src = "https://www.threads.net/embed.js";
          script.async = true;
          document.body.append(script);
        } else if (postUrl && type === "instagram") {
          const blockquote = document.createElement("blockquote");
          blockquote.className = "instagram-media";
          blockquote.setAttribute("data-instgrm-permalink", postUrl);
          blockquote.setAttribute("data-instgrm-version", "14");
          blockquote.setAttribute("data-instgrm-captioned", "");
          blockquote.style.cssText = "background:#fff;border:1px solid #f339911f;border-radius:16px;box-shadow:0 10px 28px #7e56c419;max-width:540px;min-width:270px;padding:0;width:99.375%;";
          root.append(blockquote);

          const script = document.createElement("script");
          script.src = "https://www.instagram.com/embed.js";
          script.async = true;
          document.body.append(script);
        }

        if (window.ResizeObserver) {
          const resizeObserver = new ResizeObserver(() => reportHeight());
          resizeObserver.observe(document.body);
          resizeObserver.observe(root);
        }
        new MutationObserver(() => reportHeight()).observe(root, { childList: true, subtree: true, attributes: true });
        window.addEventListener("load", () => reportHeight());
        const poll = window.setInterval(reportHeight, 300);
        window.setTimeout(() => window.clearInterval(poll), 30000);
        window.setTimeout(showEmbedError, 15000);
        reportHeight();
      })();
    </script>
  </body>
</html>
